# The gate, on every push.
#
# It runs exactly what `README.md` tells a contributor to run locally — the same
# four commands, in the same order — because a CI that checks something else is
# a second definition of "passing" and the two drift. The tool versions are
# pinned in `[project.optional-dependencies].dev` so local and CI agree on what
# ruff and mypy even mean.
#
# `libsqlcipher-dev` is installed first and is not optional. Zone B is encrypted
# at rest and `connect_ledger` REFUSES to open an unencrypted ledger rather than
# degrading (DECISIONS V1-16), so the suite genuinely needs SQLCipher present —
# a runner without it does not fail gracefully, it fails at collection.

name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The gate reads the repo and writes nothing. Without this the job inherits
# whatever the repository default is, which on older settings is write-all --
# a token any dependency in the install step could reach (CodeQL #3).
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install SQLCipher
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlcipher-dev

      # `[dev]` is not optional here despite the name: it carries ruff,
      # mypy and pytest, which are the next three steps.
      #
      # `-c requirements.lock` is what makes this reproducible. pyproject pins
      # the packages it names; the lock pins the ones underneath them, and it
      # was one of those (starlette, under fastapi) that turned this red while
      # every declared version was satisfied.
      - name: Install
        run: pip install -e ".[dev]" -c requirements.lock

      # A constraints file only binds what pip happens to install. Anything
      # resolved that the lock does not mention is still floating, and would
      # go unnoticed until the day it changed -- so fail here instead, while
      # the diff that introduced it is still on screen.
      - name: Nothing floated
        run: |
          python - <<'EOF'
          import importlib.metadata as md
          import re

          def norm(name):
              return re.sub("[-_.]+", "-", name).lower()

          locked = set()
          for raw in open("requirements.lock", encoding="utf-8"):
              line = raw.strip()
              if line and not line.startswith("#"):
                  locked.add(norm(line.split("==")[0]))

          # The project itself is installed from this checkout, not the index.
          installed = {
              norm(d.metadata["Name"])
              for d in md.distributions()
              if d.metadata["Name"]
          } - {"mf-platform", "pip", "setuptools", "wheel"}

          loose = sorted(installed - locked)
          if loose:
              raise SystemExit(
                  "installed but not in requirements.lock: " + ", ".join(loose)
              )
          print(f"all {len(installed)} installed packages are pinned")
          EOF

      # Known vulnerabilities anywhere in the pinned graph (security audit
      # 2026-09-23: nothing checked this). Through pipx, in its own environment,
      # so the auditor and its dependencies never land in the one the step
      # above just verified. `--no-deps --disable-pip` audits exactly the lock.
      - name: Vulnerabilities
        run: >-
          pipx run --spec pip-audit==2.7.3 pip-audit
          --requirement requirements.lock --no-deps --disable-pip

      - name: Lint
        run: python -m ruff check .

      - name: Types
        run: python -m mypy

      - name: Tests
        run: python -m pytest -q

      # The golden portfolio, recomputed by a verifier that imports nothing from
      # `src/`. Exits 1 on any drift from the committed expectations, which is
      # what makes the fixtures a regression baseline rather than a snapshot.
      - name: Golden-file drift
        run: python -m scripts.verify_v0_ledger --check
