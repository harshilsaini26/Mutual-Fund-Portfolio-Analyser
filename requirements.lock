# The whole dependency graph, pinned. Used as a pip CONSTRAINTS file, not a
# requirements file: `pip install -e ".[dev]" -c requirements.lock` still takes
# what to install from pyproject.toml, and takes which version from here.
#
# Why this exists, and why pinning pyproject.toml was not enough: CI failed on
# starlette 1.6.0 while this machine had 1.0.1, and starlette is not in
# pyproject.toml at all — it arrives underneath fastapi. Exact pins on the
# dependencies we name leave every dependency we do not name free to move, and
# it was one of those that broke. A constraints file is the only form of pin
# that reaches the whole graph.
#
# Entries here that a given platform does not need are simply not installed --
# a constraint bounds a package, it does not request one. `colorama` is the
# example: a pytest dependency on Windows and absent on the Linux runner.
#
# REGENERATE after any intentional upgrade, from a venv that has just passed
# the gate, so the pins describe a state that was actually green:
#
#     python -m venv .venv-lock
#     .venv-lock/bin/pip install -e ".[dev,cas]"
#     .venv-lock/bin/python -m pytest -q          # and ruff, and mypy
#     .venv-lock/bin/pip freeze --exclude-editable | sort > requirements.lock
#
# Covers `[dev]` and `[cas]` as well as the runtime set, so one file serves
# every install the README describes.
#
# No hashes. `--require-hashes` would be stronger against a compromised index,
# but it demands a hash for every build-time dependency too, and sqlcipher3
# ships as an sdist that is built on the runner. Version pinning is the part
# that was actually costing us; hashes are a separate decision.

