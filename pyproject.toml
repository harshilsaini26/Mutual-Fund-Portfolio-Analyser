# Setuptools finds the packages under `src/` by itself; this table is what
# makes `pip install -e .` work at all — without a build backend declared, pip
# has nothing to build the project with.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-platform"
version = "0.0.0"
description = "Self-hosted look-through analytics for Indian mutual fund investors"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

# EXACT pins, deliberately, and the same choice as the `dev` group below. This
# is a self-hosted application, not a library that has to co-resolve inside
# somebody else's environment, so there is no cost to pinning and a real cost
# to floating: a lower bound means a fresh clone installs whatever shipped this
# morning, and the gate then tests a program nobody has run.
#
# Pinning here is necessary and not sufficient. It fixes only the packages
# named below; `requirements.lock` fixes the ones underneath them, which is
# where the breakage actually came from. See that file.
dependencies = [
    # Zone B is encrypted at rest (PLAN.md §6.3). This is the project's one
    # runtime dependency and it is load-bearing for that: without it
    # `connect_ledger` refuses to open the ledger at all. DECISIONS V1-16.
    "sqlcipher3==0.6.2",
    # Used throughout and previously undeclared, which V0-19 called out.
    "pyyaml==6.0.3",
    "openpyxl==3.1.5",
    "httpx==0.28.1",
    # M6's API. Loopback-bound and single-user (MODULE_6 §15.3) — this is a
    # local server for one person, not a deployment.
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    # M6's HTML surface. Server-rendered rather than React — DECISIONS V1-23,
    # which overrides PLAN.md §9.10. d3 is vendored under
    # src/m6_views/static/vendor/, so there is no JS toolchain and no CDN call.
    "jinja2==3.1.6",
]

# `cas/pdf.py` imports these INSIDE its functions so the ledger stays
# importable without them — but importing lazily is not the same as not
# depending on them, and undeclared meant `pip install -e .` followed by
# `python -m jobs.import_cas` failed with ImportError.
[project.optional-dependencies]
cas = ["pypdf==6.18.1", "pdfplumber==0.11.10"]

# The gate's own tooling. `pip install -e .` installs runtime dependencies only,
# so without this group CI ran `python -m ruff` against an interpreter that had
# no ruff and exited 1 on `No module named ruff` — a failure indistinguishable,
# from the summary page, from a real lint error.
#
# PINNED EXACTLY, unlike everything above. ruff and mypy gain rules between
# releases, so a floating version turns a green `main` red on someone else's
# release schedule, with no commit of ours in between. Bumping these is a
# deliberate change that comes with whatever fixes the new rules demand.
dev = [
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pytest==9.1.1",
]

# Explicit, not auto-discovered. This is a flat layout with several importable
# top-level directories (`src`, `jobs`, `scripts`, `tests`), and setuptools
# refuses to guess between them on some versions. Only `src` is library code;
# `jobs` and `scripts` are entry points run from a checkout.
[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "RUF",       # ruff-specific
]
ignore = [
    # UP042 wants `StrEnum` instead of `(str, Enum)`. Declined deliberately:
    # the module specs write `(str, Enum)` literally (MODULE_2.md §3.2,
    # MODULE_3.md §12.1), and these values are persisted to TEXT columns.
    # `StrEnum` changes what `str()` and f-strings produce for a member, so
    # switching would alter what lands in the database for anything that
    # interpolates a member instead of its `.value`. Revisit via ADR, not lint.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# The gate deliberately reaches into module internals to prove the invariants.
"tests/unit/test_contracts.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "jobs"]
# Slice Zero is contracts only: every function body is `...`, by design.
disallow_empty_bodies = false

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

# The PDF stack is imported inside `src/m1_ledger/cas/pdf.py`'s functions, not
# at module scope: neither library is needed to parse CAS text, and requiring
# them to import the ledger would fail every test run on a machine that has not
# installed them. Neither ships type stubs.
[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*", "pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true

# openpyxl ships no type stubs and `types-openpyxl` would be a dev dependency
# for one import. The AMFI market-cap parser reads cells as `str | None` and
# converts at the boundary, so nothing downstream depends on its types.
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
