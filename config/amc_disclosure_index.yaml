# Where each AMC publishes its monthly portfolio disclosure. DECISIONS V1-32.
#
# This is the DISCOVERY layer, and it is deliberately separate from
# `amc_manifest.yaml`. The manifest names a specific FILE for a specific scheme
# and month; this names the PAGE an AMC publishes from, which changes far less
# often. V1-03 recorded that discovery was not automated because every AMC's
# page is JavaScript-rendered. That was the wrong place to look.
#
# SOURCE: one page -- https://www.amfiindia.com/online-center/portfolio-disclosure
# AMFI is a Next.js app whose RSC payload carries a structured record per AMC
# (`mf_name`, `amc_website`, `amc_monthly_portfolio_disclosure`,
# `amc_fortnightly_portfolio_disclosure`). So the entry point for all 52 comes
# from one fetch of a site this project already treats as S1 and which accepts
# an honest agent.
#
# WHAT AMFI DOES NOT DO IS HOST THE FILES. Checked for all three disclosure
# types -- fortnightly, monthly and half yearly -- and every one links out to
# the AMC's own site. The only AMFI-hosted documents on that page are SAI PDFs.
# So this removes the work of FINDING an AMC's disclosure page; it does not
# remove the need to fetch from the AMC.
#
# Captured 2026-09-13. Re-derive rather than hand-edit.

meta:
  captured: 2026-09-13
  source: https://www.amfiindia.com/online-center/portfolio-disclosure
  count: 52
  # Kotak's page is behind Radware bot management. Selecting the portfolio
  # dropdown redirects to validate.perfdrive.com and serves a CAPTCHA, which
  # this project does not solve (V1-03). The URL is recorded because it is the
  # correct one, not because it is reachable from here.
  blocked:
    - Kotak Mahindra Mutual Fund

