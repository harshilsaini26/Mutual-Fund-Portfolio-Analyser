# Portfolio disclosure links, per AMC. MODULE_0.md §5.4, DECISIONS V1-03.
#
# Discovery is NOT automated yet. Every AMC's disclosure page is JavaScript-
# rendered, so finding a link needs a browser while fetching one does not —
# and keeping that fragility out of the loader is the point. `scripts/
# refresh_amc_manifest.py` regenerates this with a browser when run.
#
# Each entry must carry `scheme_id` (the ISIN, per MODULE_0.md §4.4), because
# a disclosure file names its scheme in prose and prose is not a key.

meta:
  refreshed: 2026-09-05
  note: >
    HDFC and ICICI are verified (DECISIONS V1-08, V1-10). ICICI has no entry
    here because it publishes 146 per-scheme workbooks in one 25 MB ZIP and
    MODULE_0.md section 6.5's member-level staging is not built — until it is,
    load one extracted member with
    `python -m jobs.load_holdings --amc icici --file <member> --scheme <ISIN>`.
    Nippon is verified (V1-15) and needs a `sheet`: it publishes 108 schemes as
    108 sheets of ONE workbook, so a parse without one merges every portfolio
    in the file. Kotak is verified (V1-33) and has no entry here for the same
    reason it has no URL: its site is behind Radware bot management and
    selecting the portfolio dropdown serves a CAPTCHA, which this project will
    not solve (V1-32 records the three routes that were tried). Its workbook is
    hand-downloaded and loaded by path, and it needs a `--sheet` for the same
    reason Nippon does — 119 schemes, one per sheet:
      `python -m jobs.load_holdings --file <workbook> --scheme INF174KA1EZ1 --sheet KPF`
    SBI is pending; its disclosure page is in config/amc_disclosure_index.yaml.
    Whatever their layouts violate will be recorded in DECISIONS as found.

disclosures:
  - amc_id: hdfc
    scheme_id: INF179K01UT0        # HDFC Flexi Cap Fund, Direct Growth
    scheme_name: HDFC Flexi Cap Fund
    as_of: 2026-07-31
    url: "https://files.hdfcfund.com/s3fs-public/2026-08/Monthly%20HDFC%20Flexi%20Cap%20Fund%20-%2031%20July%202026.xlsx"
    filename: "Monthly HDFC Flexi Cap Fund - 31 July 2026.xlsx"

  - amc_id: nippon
    # 108 schemes, one per sheet, in a single 1.3 MB workbook. `sheet` is the
    # scheme's own two-letter code, listed on the workbook's `Index` sheet.
    scheme_id: INF204K01E54        # Nippon India Growth Mid Cap Fund, Direct Growth
    scheme_name: Nippon India Growth Mid Cap Fund
    sheet: GF
    as_of: 2026-07-31
    # Served as .xls with Content-Type application/vnd.ms-excel; it is a ZIP,
    # i.e. really .xlsx. Both the extension and the header lie (V1-15).
    url: "https://mf.nipponindiaim.com/InvestorServices/FactsheetsDocuments/NIMF-MONTHLY-PORTFOLIO-31-July-26.xls"
    filename: "NIMF-MONTHLY-PORTFOLIO-31-July-26.xls"
