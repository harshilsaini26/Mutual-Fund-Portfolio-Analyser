# Portfolio disclosure links, per AMC. MODULE_0.md §5.4, DECISIONS V1-03.
#
# Discovery is NOT automated yet. Every AMC's disclosure page is JavaScript-
# rendered, so finding a link needs a browser while fetching one does not —
# and keeping that fragility out of the loader is the point. `scripts/
# refresh_amc_manifest.py` regenerates this with a browser when run.
#
# Each entry must carry `scheme_id` (the ISIN, per MODULE_0.md §4.4), because
# a disclosure file names its scheme in prose and prose is not a key.

