# Risk-free rate. MODULE_0.md section 2.1 source S13, MODULE_2.md section 8.1.
#
# Every 91-day Government of India Treasury Bill auction from 2011-04-06 to
# 2026-04-08: 772 observations, each one a real auction's implicit yield at
# cut-off, in percent a year.
#
# WHERE IT CAME FROM
#   RBI's Database on Indian Economy, "Auctions of Government of India treasury
#   bills", which the RBI Monthly Bulletin feeds:
#
#       https://dbie.rbihub.in/government/treasury-bill-auctions
#
#   Read in a browser and transcribed, which is how tax_rules.yaml is
#   maintained and for the same reason: rbi.org.in answers an automated client
#   with HTTP 418, and README's rule is that nothing here defeats a bot check.
#   Nothing fetches this file's contents at run time, and no job refreshes it.
#
# WHY EVERY AUCTION AND NOT A QUARTERLY SAMPLE
#   This file used to say "quarterly is plenty; the 91-day yield does not move
#   enough between auctions to matter". Measured against the full weekly
#   series, that was wrong. The error a sample introduces at a window start:
#
#       quarterly (61 rows)     max 4.50pp   p99 3.15pp   mean 0.245pp
#       monthly  (181 rows)     max 3.74pp   p99 0.86pp   mean 0.092pp
#       every auction (772)     max 0.00pp   p99 0.00pp   mean 0.000pp
#
#   July 2013 is what breaks the coarse samples. RBI raised the MSF rate to
#   defend the rupee and the 91-day cut-off went from 7.24% to 12.02% inside
#   one quarter. A Sharpe over a window starting then, judged against a
#   quarterly sample, is out by more than the risk-free rate itself -- enough
#   to invert the sign of the ratio. Since the full series costs 20KB and a
#   binary search, there is no reason to carry the error.
#
# WHAT IT IS USED FOR
#   Sharpe and Sortino only. Returns, volatility, drawdown and rolling returns
#   need no risk-free rate and are unaffected by this file.
#
# HOW IT IS READ
#   The rate in force on a date is the latest observation ON OR BEFORE it,
#   found by binary search over this list sorted by date. A window that starts
#   before 2011-04-06 gets no Sharpe at all rather than one computed from a
#   rate that was not yet on record.
#
# COVERAGE, AND ITS TWO EDGES
#   Behind: 2 of the 15,006 schemes with NAV have history older than
#   2011-04-06. Their since_first_nav window gets no Sharpe; every scheme's
#   1y, 3y and 5y window is covered in full.
#
#   Ahead: the DBIE table is bulletin-sourced and lags. It ends 2026-04-08
#   while NAV runs to 2026-09-06, so a window starting in that gap is judged
#   against the April rate carried forward. Five months of carry on a 91-day
#   yield that has sat between 5.30 and 5.35 all year; re-read the page to
#   close it.
#
# FIVE AUCTIONS ARE ABSENT -- 2016-01-27, 2016-02-24, 2023-03-29, 2025-02-20
# and 2026-03-25 published no yield. Carry-forward covers those weeks. DBIE
# also lists 2026-01-14 twice, under two issue dates, at one yield; 773 rows
# upstream are therefore 772 here.
#
# To extend: add rows as `YYYY-MM-DD: percent`. Order does not matter; the
# reader sorts. A duplicate date is a YAML key collision and the last one
# silently wins, so do not add one.

source: "RBI 91-day Treasury Bill, implicit yield at cut-off"
source_url: "https://dbie.rbihub.in/government/treasury-bill-auctions"

