# MODULE_0.md §13.1. Sources are data, not code — a URL that changes must not
# need a release.
#
# §2 is emphatic that every URL in the spec is "a starting point to verify at
# implementation time, not a constant to hardcode". The S1 URL below was
# verified live on 2026-09-05: HTTP 200, `text/plain`, and the header line the
# parser expects. If it 404s the job must fail loudly and log the attempted
# URL — never fall back to a guess.

defaults:
  rate_limit_per_sec: 0.5        # 1 request per 2 seconds, per domain (§2.3)
  burst: 2
  timeout_connect: 30
  timeout_read: 120
  retries: 3
  backoff_base_sec: 2
  backoff_cap_sec: 60
  # AMFI accepts an honest agent, so §2.3 is followed literally here.
  user_agent: "mf-platform/0.1 (personal research; contact: {CONTACT_EMAIL})"
  # Sent as the `From:` header on every request, whatever the agent string.
  # This is what keeps us contactable on hosts that reject an honest agent.
  from_email: "{CONTACT_EMAIL}"
  respect_robots: true

sources:
  S1:
    name: amfi_nav
    kind: fixed_url
    url: "https://www.amfiindia.com/spages/NAVAll.txt"
    parser: nav.amfi
    verified_on: 2026-09-05
    # This one file lists every scheme: scheme code, both ISINs, name, plan,
    # option, NAV and date, with AMC and SEBI category from the section context
    # lines (DECISIONS V0-20). What it lacks -- the fund a share class belongs
    # to, and when it launched -- comes from S2.
    provides: [nav_daily, scheme, amc]

  S2:
    name: amfi_scheme_master
    kind: fixed_url
    url: "https://portal.amfiindia.com/DownloadSchemeData_Po.aspx?mf=0"
    parser: scheme_master.amfi
    verified_on: 2026-09-23
    # One row per share class. "Scheme Name" names the FUND, identically for
    # every plan of it, which the share-class name alone could not recover for
    # older schemes; "Launch Date" is when it launched. Refreshed by
    # `jobs.fetch_nav` on every run, so it needs no command of its own.
    provides: [scheme.fund_name, scheme.inception_date]

  S6:
    name: mfapi_scheme_nav
    kind: per_scheme
    # `{code}` is the AMFI scheme code, which `scheme.amfi_code` already holds.
    url: "https://api.mfapi.in/mf/{code}"
    parser: nav.mfapi
    verified_on: 2026-09-06
    provides: [nav_daily]
    # A MIRROR, not the publisher. AMFI (S1) stays the source of record per
    # V1-02, and this only ever FILLS GAPS — see `load_navs_where_absent`.
    # Measured on HDFC Flexi Cap: 2,117 overlapping dates, 1 disagreement
    # (2026-03-12, mfapi 2111.846 vs AMFI 2111.779). DECISIONS V1-19.
    #
    # Its value is that it is PER SCHEME. AMFI's history export is per AMC
    # code, so fetching three funds meant fetching three whole fund houses —
    # which is why the warehouse holds 3.1M NAV rows to serve 5,924.
    role: mirror

  S3:
    name: amfi_scheme_aum
    kind: fixed_url
    # Three calls: financial years, that year's quarters, then the data.
    # `src/m0_data/fetch/amfi_aum.py` builds them; none takes a secret.
    url: "https://www.amfiindia.com/api/average-aum-schemewise"
    parser: aum.amfi
    verified_on: 2026-09-13
    provides: [scheme_aum]
    # AMFI accepts an honest agent, so §2.3 is followed literally -- the
    # default user_agent is inherited rather than overridden. robots.txt
    # disallows only /admin/, /login/ and /search/.
    respect_robots: true
    # The witness §10's V2 needs. A disclosure states its own total, so
    # reconciling one against itself catches nothing; this is the only figure
    # in the warehouse that comes from outside the file being checked.
    # QUARTERLY AVERAGE, not a month-end balance -- see V1-49 for what that
    # costs and why V2 carries a second tolerance because of it.
    role: witness

  S14:
    name: amfi_scheme_ter
    kind: fixed_url
    # The TER page's own "download": one workbook per month, every fund, one
    # row per day. The JSON behind the same page pages at 100 rows (~500
    # requests a month), so it is not used. `src/m0_data/fetch/amfi_ter.py`.
    url: "https://www.amfiindia.com/api/populate-te-rdata-revised?MF_ID=All&Month={month}&strCat=-1&strType=-1&excel=true"
    parser: ter.amfi
    verified_on: 2026-09-25
    provides: [scheme_ter]
    # robots.txt, read 2026-09-25: disallows only /admin/, /login/, /search/.
    respect_robots: true
    # AMFI builds the workbook on request: ~20 s for ~4 MB.
    timeout_read: 180
    # The published figure itself (DECISIONS V1-78): total and base TER.
    role: record

  S5:
    name: amc_portfolio_disclosure
    kind: per_amc_manifest
    parser: holdings.*
    verified_on: 2026-09-05
    # HDFC's CDN (files.hdfcfund.com) returns 403 for an honest agent AND for a
    # browser string with a contact appended — only a bare browser string is
    # accepted. The contact moves to `From:`. DECISIONS V1-05.
    user_agent: browser
    # Statutory monthly disclosures SEBI requires every AMC to publish. Links
    # live in config/amc_manifest.yaml; discovery is not automated (V1-03).

  S7:
    name: groww_scheme_portfolio
    kind: per_scheme
    # `{slug}` is Groww's own URL segment, which is NOT derivable from the
    # scheme name -- HDFC Flexi Cap lives at `hdfc-equity-fund-direct-growth`,
    # the fund's name before it was renamed. config/groww_slugs.yaml maps them
    # and the fetch REFUSES a page whose ISIN is not the one expected.
    url: "https://groww.in/mutual-funds/{slug}"
    parser: holdings.groww
    verified_on: 2026-09-13
    provides: [holding]
    user_agent: browser
    # robots.txt allows /mutual-funds/<slug> and the page sets
    # `meta_robots: index`. /v1/api/* is Disallow, so the internal JSON API is
    # NOT used -- only the server-rendered page, which carries the whole
    # portfolio in its `__NEXT_DATA__` payload.
    respect_robots: true
    # THE COVERAGE TIER, not the source of record. It reaches every scheme
    # Groww lists rather than the five AMCs with a parser, and it pays for that
    # with the ISIN column: 8.96% of HDFC Flexi Cap goes unresolved where the
    # AMC's own file gives 0.00%. Where an AMC file exists, it wins.
    # DECISIONS V1-43.
    role: coverage
    tier: aggregator

  S12:
    name: nse_index_tri
    kind: per_index_range
    # POSTed, not fetched by URL: the page's own script builds a `cinfo`
    # envelope and `src/m0_data/fetch/nifty_tri.py` builds the same one. One
    # calendar year per request -- their script refuses a wider range and the
    # endpoint agrees.
    url: "https://www.niftyindices.com/BackPage/getTotalReturnIndexString"
    parser: index.nifty_tri
    verified_on: 2026-09-19
    provides: [index_level, benchmark_index]
    # niftyindices drops a request with no User-Agent and answers a
    # browser-shaped one with 200. DECISIONS V1-05 settled this host by name,
    # alongside HDFC's CDN; the contact travels in `From:`.
    user_agent: browser
    # Read 2026-09-19: `Allow: /`, four unrelated pages disallowed, nothing
    # under /BackPage. There is no challenge here to answer -- the block is a
    # User-Agent filter, not bot detection.
    respect_robots: true
    # TOTAL RETURN, and that is the whole point. PLAN.md §9.4 refuses a
    # price-return series for alpha: PRI omits dividends, so alpha measured
    # against it is overstated by roughly the index's dividend yield, in our
    # favour and invisibly. The endpoint returns gross TRI and net-of-tax NTR
    # side by side; migrations/014_index.sql stores the gross one.
    role: source_of_record
