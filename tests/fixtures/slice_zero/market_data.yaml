# Backs FakeMarketDataProvider (M0 §11) and the scheme-master half of
# FakeFundDataProvider. Zone A data only — no personal ledger rows here.

schemes:
  - scheme_id: HDFC-TOP100-DIR
    scheme_name: HDFC Top 100 Fund - Direct Growth
    amfi_code: "118989"
    isin: INF179K01YV8
    amc_id: HDFC
    plan: direct
    option: growth
    sebi_category: Large Cap
    benchmark_id: NIFTY100-TRI
    inception_date: 2013-01-01
    status: active

  # Same fund, Regular plan. Different ISIN, different NAV series, ~1%/yr
  # apart. Present so a test can prove resolution never conflates them.
  - scheme_id: HDFC-TOP100-REG
    scheme_name: HDFC Top 100 Fund - Regular Growth
    amfi_code: "100119"
    isin: INF179K01BC0
    amc_id: HDFC
    plan: regular
    option: growth
    sebi_category: Large Cap
    benchmark_id: NIFTY100-TRI
    inception_date: 1996-10-11
    status: active

  - scheme_id: AXIS-MID-DIR
    scheme_name: Axis Midcap Fund - Direct Growth
    amfi_code: "120505"
    isin: INF846K01_31
    amc_id: AXIS
    plan: direct
    option: growth
    sebi_category: Mid Cap
    benchmark_id: NIFTYMID150-TRI
    inception_date: 2013-01-01
    status: active

  # Held, but its latest disclosure is quarantined — drives __NO_DISCLOSURE__.
  - scheme_id: SBI-SC-DIR
    scheme_name: SBI Small Cap Fund - Direct Growth
    amfi_code: "125497"
    isin: INF200K01_58
    amc_id: SBI
    plan: direct
    option: growth
    sebi_category: Small Cap
    benchmark_id: NIFTYSML250-TRI
    inception_date: 2013-05-16
    status: active

  # Merged away in 2021. Resolution must follow the chain to HDFC-TOP100-DIR.
  - scheme_id: FRANKLIN-BLUE-DIR
    scheme_name: Franklin India Bluechip - Direct Growth
    amfi_code: "103174"
    isin: INF090I01_29
    amc_id: FRANKLIN
    plan: direct
    option: growth
    sebi_category: Large Cap
    benchmark_id: NIFTY100-TRI
    inception_date: 2013-01-01
    status: merged
    merged_into: HDFC-TOP100-DIR
    merger_date: 2021-06-18
    merger_ratio_num: 731
    merger_ratio_den: 1000

mergers:
  # Non-unit ratio on purpose: 0.731 successor units per predecessor unit.
  # grandfathered_nav is per-unit and must be rescaled by it, not carried over.
  - predecessor_scheme_id: FRANKLIN-BLUE-DIR
    successor_scheme_id: HDFC-TOP100-DIR
    merger_date: 2021-06-18
    ratio_num: 731
    ratio_den: 1000

# 6-decimal NAVs. None of these is exactly representable in binary floating
# point, which is the point of storing them as TEXT.
navs:
  HDFC-TOP100-DIR:
    - {nav_date: 2018-01-31, nav: "521.847193", is_interpolated: false}
    - {nav_date: 2024-04-01, nav: "998.114260", is_interpolated: false}
    - {nav_date: 2025-04-01, nav: "1102.556831", is_interpolated: false}
    - {nav_date: 2026-07-31, nav: "1284.339072", is_interpolated: false}
    - {nav_date: 2026-08-31, nav: "1301.772415", is_interpolated: false}
  HDFC-TOP100-REG:
    - {nav_date: 2026-07-31, nav: "1187.402556", is_interpolated: false}
    - {nav_date: 2026-08-31, nav: "1202.884301", is_interpolated: false}
  AXIS-MID-DIR:
    - {nav_date: 2024-04-01, nav: "88.442017", is_interpolated: false}
    - {nav_date: 2026-07-31, nav: "142.839104", is_interpolated: false}
    # Interpolated, and flagged as such — a filled NAV is not a fetched NAV.
    - {nav_date: 2026-08-31, nav: "148.006663", is_interpolated: true}
  SBI-SC-DIR:
    - {nav_date: 2026-07-31, nav: "204.667319", is_interpolated: false}
  FRANKLIN-BLUE-DIR:
    - {nav_date: 2018-01-31, nav: "402.118844", is_interpolated: false}
