  HDFC-TOP100-REG: equity
  AXIS-MID-DIR: equity
  SBI-SC-DIR: equity
  FRANKLIN-BLUE-DIR: equity

# Dated: TER changes over time, so a single number would be wrong for any
# window that spans a change.
ter:
  HDFC-TOP100-DIR:
