    - {valid_from: 2024-04-01, valid_to: null, ter: "1.0400"}
  HDFC-TOP100-REG:
    - {valid_from: 2013-01-01, valid_to: null, ter: "1.6900"}
  AXIS-MID-DIR:
    - {valid_from: 2013-01-01, valid_to: null, ter: "0.5700"}
  SBI-SC-DIR:
    - {valid_from: 2013-05-16, valid_to: null, ter: "0.6600"}
  FRANKLIN-BLUE-DIR:
