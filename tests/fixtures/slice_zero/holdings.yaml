# Backs the holdings half of FakeFundDataProvider and FakeMarketDataFeed.
#
# pct_normalised sums to exactly 100 per scheme-date — the M0 §7.3 guarantee
# every downstream aggregation depends on.
#
# pct_to_nav is the as-reported figure, and the three schemes deliberately span
# the range real disclosures show: HDFC-TOP100-DIR sums to 99.860,
# HDFC-TOP100-REG to exactly 100.000, AXIS-MID-DIR to 100.140. Aggregating on
# it would make look-through disagree with portfolio value, so tests assert the
# engine never touches it.

issuers:
  ISS-HDFCBANK:   {name: HDFC Bank Ltd, sector: Financial Services, mcap: large, primary_isin: INE040A01034}
  ISS-RELIANCE:   {name: Reliance Industries Ltd, sector: Oil Gas & Consumable Fuels, mcap: large, primary_isin: INE002A01018}
  ISS-INFY:       {name: Infosys Ltd, sector: Information Technology, mcap: large, primary_isin: INE009A01021}
  ISS-ICICIBANK:  {name: ICICI Bank Ltd, sector: Financial Services, mcap: large, primary_isin: INE090A01021}
  ISS-LT:         {name: Larsen & Toubro Ltd, sector: Capital Goods, mcap: large, primary_isin: INE018A01030}
  ISS-CUMMINS:    {name: Cummins India Ltd, sector: Capital Goods, mcap: mid, primary_isin: INE298A01020}
  ISS-PERSISTENT: {name: Persistent Systems Ltd, sector: Information Technology, mcap: mid, primary_isin: INE262H01021}
  ISS-SUPREME:    {name: Supreme Industries Ltd, sector: Capital Goods, mcap: mid, primary_isin: INE195A01028}
  # Synthetics. Present in exposure, absent from concentration denominators.
  __CASH__:       {name: Cash & Cash Equivalents, sector: null, mcap: null, primary_isin: null, synthetic: true}
  __DERIV__:      {name: Derivatives, sector: null, mcap: null, primary_isin: null, synthetic: true}
  __UNRESOLVED__: {name: Unresolved Holdings, sector: null, mcap: null, primary_isin: null, synthetic: true}
  __NO_DISCLOSURE__: {name: No Disclosure Available, sector: null, mcap: null, primary_isin: null, synthetic: true}

# ISIN -> issuer. Two Reliance lines (equity + NCD) map to ONE issuer: that is
# why look-through joins on issuer_id and never on isin.
isin_to_issuer:
  INE040A01034: ISS-HDFCBANK
  INE002A01018: ISS-RELIANCE
  INE002A08021: ISS-RELIANCE      # Reliance NCD — same issuer, different instrument
  INE009A01021: ISS-INFY
  INE090A01021: ISS-ICICIBANK
  INE018A01030: ISS-LT
  INE298A01020: ISS-CUMMINS
  INE262H01021: ISS-PERSISTENT
  INE195A01028: ISS-SUPREME

disclosure_dates:
  HDFC-TOP100-DIR: [2026-05-31, 2026-06-30, 2026-07-31]
  HDFC-TOP100-REG: [2026-05-31, 2026-06-30, 2026-07-31]
  AXIS-MID-DIR:    [2026-05-31, 2026-06-30, 2026-07-31]
  SBI-SC-DIR:      [2026-05-31, 2026-06-30, 2026-07-31]

disclosure_quality:
  HDFC-TOP100-DIR:
    2026-07-31: {unresolved_pct: "0.000000", weight_residual: "0.000000",
                 validation_status: ok, row_count: 6, staleness_days: 31,
                 usable_for_lookthrough: true, confidence: high}
  HDFC-TOP100-REG:
    2026-07-31: {unresolved_pct: "0.000000", weight_residual: "0.000000",
                 validation_status: ok, row_count: 4, staleness_days: 31,
                 usable_for_lookthrough: true, confidence: high}
  AXIS-MID-DIR:
    # 4.2% unresolved — above the 2% threshold, so a caveat must fire and an
    # explicit __UNRESOLVED__ block must appear in the look-through.
    2026-07-31: {unresolved_pct: "4.200000", weight_residual: "0.140000",
                 validation_status: warn, row_count: 5, staleness_days: 31,
                 usable_for_lookthrough: true, confidence: medium}
  SBI-SC-DIR:
    # Quarantined: excluded entirely, coverage_pct reduced, position value
    # lands in __NO_DISCLOSURE__ rather than disappearing.
    2026-07-31: {unresolved_pct: "0.000000", weight_residual: "12.400000",
                 validation_status: quarantined, row_count: 0, staleness_days: 31,
                 usable_for_lookthrough: false, confidence: low}

