# V0.1 scheme master.
#
# PROVENANCE IS MIXED, and the mix is the point:
#   - NAV series: AMFI historical exports (nav_series.yaml). Authoritative.
#   - Everything else: ET Money fund pages, captured 2026-09-05, by screenshot.
#     There is no archived source file, so `PLAN.md` §4.2 ("every number traces
#     to a row in an archived source file") is NOT satisfied. Adequate for a
#     V0.1 fixture; not adequate for a warehouse row. M0 replaces all of it.
#
# THE PLAN MISMATCH, and how it was resolved:
#   The supplied HDFC NAV workbook is the DIRECT plan. The screenshot it was
#   paired with was the REGULAR plan — NAV Rs 2,271.32 vs Rs 2,062.38 on
#   2026-09-04, a 10.13% gap, confirmed on a second date. Per DECISIONS V0-05
#   the scheme record was switched to Direct to match the NAV series.
#
#   Consequence: the fields below that came from the REGULAR page do not
#   describe the Direct plan and are nulled rather than carried across.
#   Carrying them would relocate the conflation, not resolve it — and a value
#   reconciliation is the only thing that ever catches it.

meta:
  nav_source: AMFI historical NAV export
  attribute_source: ET Money fund pages (screenshots)
  captured: 2026-09-05
  archived_source_file_id: null
  confidence: low
  caveats:
    - "Scheme identifiers are placeholders; ET Money displays no ISIN or AMFI code."
    - "HDFC is the Direct plan; its TER and inception could not be sourced for that plan."
    - "Aditya Birla Large & Mid has no NAV series and is therefore absent."
    - "Two of three schemes publish no benchmark at all."

schemes:
  - scheme_id: AMFI:HDFC-FLEXICAP-DIR-G
    scheme_name: HDFC Flexi Cap Fund - Growth Option - Direct Plan
    amc_id: HDFC
    plan: direct
    option: growth
    sebi_category: Flexi Cap
    benchmark_id: NIFTY500-TRI          # scheme-level; same for both plans
    status: active

    # Scheme-level terms, identical across plans, so these carry over safely.
    exit_load_pct: "1.0"
    exit_load_days: 365
    lock_in_days: 0
    risk_label: Very High
    aum_inr: "1107360000000.0000"       # 1,10,736 Cr — whole scheme, both plans
    aum_as_of: 2026-08-31

    # NULLED: these came from the Regular plan's page and are wrong here.
    #
    # A Direct plan carries no distributor commission, so its TER is materially
    # lower than the Regular plan's 1.08 base / 1.37 total. Inventing a number
    # would understate the fee drag this product exists to surface.
    base_ter: null
    total_ter: null
    ter_source: "unsourced for the Direct plan; Regular page reported 1.08/1.37"

    # The scheme dates from 1994-12-08, but Direct plans did not exist until
    # SEBI introduced them, so the Direct plan's own inception is later. The
    # NAV export starts 2021-10-05 (the range requested), so it does not
    # establish the date either. Left null rather than guessed — it drives the
    # W_fund window in MODULE_2.md §3 and a wrong value silently lengthens it.
    inception_date: null
    inception_note: "scheme inception 1994-12-08; Direct plan inception not sourced"

  - scheme_id: AMFI:ICICI-MULTIASSET-REG-G
    scheme_name: ICICI Prudential Multi Asset Allocation Fund - Growth
    amc_id: ICICI
    plan: regular
    option: growth
    sebi_category: Multi Asset Allocation
    status: active

    # This one is internally consistent: the NAV workbook says Regular Plan and
    # the screenshot said Regular. Cross-checked on two dates — file 814.7963 vs
    # page 814.80 (2026-09-03), and 423.1191 vs chart 423.12 (2021-10-14).
    # Both agree to display rounding.
    base_ter: "1.0600"
    total_ter: "1.4200"
    ter_as_of: 2026-08-31
    exit_load_pct: "1.0"
    exit_load_days: 365
    lock_in_days: 0
    aum_inr: "867850000000.0000"        # 86,785 Cr
    aum_as_of: 2026-08-31
    risk_label: Very High
    inception_date: 2002-10-07

    # "Benchmark: NA" on the fund page. This is NOT the TRI-vs-PRI case
    # CLAUDE.md invariant 7 covers — there is no benchmark at all, which is the
    # separate bm_available=False path (DECISIONS V0-02). Alpha, tracking
    # error, information ratio and Brinson must all be suppressed with a
    # reason, never rendered as zero.
    benchmark_id: null

  - scheme_id: AMFI:KOTAK-PIONEER-DIR-G
    scheme_name: Kotak Pioneer Fund- Direct Plan- Growth Option
    amc_id: KOTAK
    plan: direct
    option: growth
    sebi_category: Thematic
    status: active

    # Consistent throughout: workbook says Direct Plan, screenshot says Direct,
    # and NAV 39.53 on 2026-09-03 matches the page exactly.
    #
    # Unlike HDFC, this scheme's TER IS the Direct plan's, because the
    # screenshot was taken on the Direct plan. 0.64% total against HDFC's
    # 1.37% Regular is the distributor commission made concrete.
    base_ter: "0.4800"
    total_ter: "0.6400"
    ter_as_of: 2026-08-31

    # HALF the other two schemes' exit load. Exit load is a per-scheme term,
    # and a fixture with one rate cannot catch code that hardcodes it.
    exit_load_pct: "0.5"
    exit_load_days: 365
    lock_in_days: 0
    aum_inr: "40230000000.0000"     # 4,023 Cr
    aum_as_of: 2026-08-31
    risk_label: Very High

    # Unambiguous here, unlike HDFC: the scheme launched 2019-10-09, well after
    # SEBI introduced Direct plans, so scheme inception and Direct-plan
    # inception are the same date.
    inception_date: 2019-10-09

    # "Benchmark: NA" again — the second scheme of three with no benchmark at
    # all. DECISIONS V0-02 is not a one-off: bm_available=False needs to be a
    # first-class state, not an edge case.
    benchmark_id: null

# --- tax class --------------------------------------------------------------
# scheme_tax_class is point-in-time in MODULE_0.md, and the ICICI fund is why.
#
# A multi-asset fund is taxed as equity only while its equity allocation stays
# above the statutory threshold, and that allocation moves with the manager.
# Its fund page shows no tax rows at all. Recorded as unknown; the lot engine
# raises rather than defaulting, because MODULE_1.md §10.2 is explicit that
# defaulting to equity understates tax.
tax_class:
  AMFI:HDFC-FLEXICAP-DIR-G:
    - {valid_from: 2013-01-01, valid_to: null, tax_class: equity, source: etmoney_ui}
  AMFI:ICICI-MULTIASSET-REG-G:
    - {valid_from: 2002-10-07, valid_to: null, tax_class: null, source: unknown}
  AMFI:KOTAK-PIONEER-DIR-G:
    - {valid_from: 2019-10-09, valid_to: null, tax_class: equity, source: etmoney_ui}

benchmarks:
  - {index_id: NIFTY500-TRI, index_name: NIFTY 500 TRI, provider: NSE,
     is_total_return: true}

# --- NOT stored -------------------------------------------------------------
# "Returns since inception" is derived and recomputable from the NAV series, so
# storing it invites the two to disagree (CLAUDE.md invariant 10).
# ET Money's star rating is a third-party opinion, and PLAN.md §3.3 forbids
# surfacing prescriptive signals.
