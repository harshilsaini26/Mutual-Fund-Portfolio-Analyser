# Golden expected output for transactions.csv — PLAN.md §8.3.
#
# Hand-computed independently of the lot engine, from transactions.csv alone.
# If the engine and this file ever disagree, one of them is wrong and the
# disagreement is the finding; do not edit this file to match the engine.
#
# Reproduce the derivation with:  python -m scripts.verify_v0_ledger

lots:
  # Six SIP instalments, six lots. Cost exceeds the amount paid by the stamp
  # duty, which is why cost_per_unit is 1000.05 and not 1000.00.
  - {lot_id: L1, scheme: HDFC, acquisition_date: 2024-01-01, origin: sip,
     units_original: "10.000000", cost_total: "10000.50", cost_per_unit: "1000.050000"}
  - {lot_id: L2, scheme: HDFC, acquisition_date: 2024-02-01, origin: sip,
     units_original: "8.000000", cost_total: "10000.50", cost_per_unit: "1250.062500"}
  - {lot_id: L3, scheme: HDFC, acquisition_date: 2024-03-01, origin: sip,
     units_original: "10.000000", cost_total: "10000.50", cost_per_unit: "1000.050000"}
  - {lot_id: L4, scheme: HDFC, acquisition_date: 2024-04-01, origin: sip,
     units_original: "6.250000", cost_total: "10000.50", cost_per_unit: "1600.080000"}
  - {lot_id: L5, scheme: HDFC, acquisition_date: 2024-05-01, origin: sip,
     units_original: "8.000000", cost_total: "10000.50", cost_per_unit: "1250.062500"}
  - {lot_id: L6, scheme: HDFC, acquisition_date: 2024-06-01, origin: sip,
     units_original: "5.000000", cost_total: "10000.50", cost_per_unit: "2000.100000"}
  - {lot_id: L7, scheme: ABSL, acquisition_date: 2024-06-10, origin: purchase,
     units_original: "125.000000", cost_total: "100005.00", cost_per_unit: "800.040000"}
  # IDCW_REINVEST creates a lot with a FRESH acquisition date, and is also
  # slab-taxable income. Both effects, from one transaction.
  - {lot_id: L8, scheme: ABSL, acquisition_date: 2025-08-20, origin: idcw_reinvest,
     units_original: "4.000000", cost_total: "3000.15", cost_per_unit: "750.037500"}
  # The clock RESTARTS on the switch-in leg. Booking the original ABSL
  # acquisition date here would convert a short holding into a long one.
  - {lot_id: L9, scheme: ICICI, acquisition_date: 2026-01-15, origin: switch_in,
     units_original: "29.999700", cost_total: "22500.89", cost_per_unit: "750.037167"}

# T007 (bounced SIP) and T008 (its reversal) create NO lot. Excluded, not
# netted — netting would leave a phantom zero-unit lot in the FIFO queue.
lots_not_created_from: [T007, T008]

consumptions:
  # THE case that matters: one REDEMPTION, three lots, two gain types.
  # An engine that classifies per-transaction instead of per-lot gets this wrong.
  T009:
    - {lot_id: L1, units_consumed: "10.000000", holding_days: 380, gain_type: LTCG,
       cost_allocated: "10000.5000", proceeds_net: "19799.8000", gain_amount: "9799.3000"}
    - {lot_id: L2, units_consumed: "8.000000", holding_days: 349, gain_type: STCG,
       cost_allocated: "10000.5000", proceeds_net: "15839.8400", gain_amount: "5839.3400"}
    - {lot_id: L3, units_consumed: "2.000000", holding_days: 320, gain_type: STCG,
       cost_allocated: "2000.1000", proceeds_net: "3959.9600", gain_amount: "1959.8600"}
  # A switch is a redemption for tax purposes even though no cash moved.
  T013:
    - {lot_id: L7, units_consumed: "25.000000", holding_days: 584, gain_type: LTCG,
       cost_allocated: "20001.0000", proceeds_net: "22499.7700", gain_amount: "2498.7700"}

totals:
  # Net proceeds must tie exactly to gross minus exit load minus STT.
  T009:
    gross: "40000.00"
    exit_load: "400.00"
    stt: "0.40"
    net_total: "39599.60"
    net_per_unit: "1979.980000"
    cost_allocated: "22001.1000"
    gain_amount: "17598.5000"
  T013:
    gross: "22500.00"
    exit_load: "0"
    stt: "0.23"
    net_total: "22499.77"
    net_per_unit: "899.990800"
    cost_allocated: "20001.0000"
    gain_amount: "2498.7700"

units_remaining:
  PLACEHOLDER:HDFC-FLEXICAP-REG-G: "27.250000"    # 47.25 in, 20 out
  PLACEHOLDER:ABSL-LARGEMID-REG-G: "104.000000"   # 125 + 4 - 25
  PLACEHOLDER:ICICI-MULTIASSET-REG-G: "29.999700"

# PLAN.md §8.3 invariant 1. Signed transaction units, excluding the reversed
# pair, must equal the sum of units remaining across all open lots.
conservation:
  signed_txn_units: "161.249700"
  sum_units_remaining: "161.249700"

# Slab-taxable income, separate from capital gains. IDCW_REINVEST appears here
# AND in `lots` above — MODULE_1.md §3.2, "both effects must fire".
idcw_income:
  - {txn_ref: T011, txn_date: 2025-02-20, amount: "2500.00", creates_lot: false}
  - {txn_ref: T012, txn_date: 2025-08-20, amount: "3000.00", creates_lot: true}

# Not assertable yet — needs the NAV series. Left explicit so it is visibly
# outstanding rather than quietly skipped.
pending_nav_series:
  - market_value
  - unrealised_pnl
  - portfolio_xirr
  - twrr
  - "PLAN.md §8.3 invariant 4 (P&L closure)"
